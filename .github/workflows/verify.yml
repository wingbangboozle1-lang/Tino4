name: Verify public dashboard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build without private inputs or network
        run: python3 tools/build.py
      - name: Verify source labels, links, rounding and publication boundary
        run: python3 tools/verify.py
      - name: Independently test arithmetic and content regressions
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Confirm generated public files are reproducible
        run: git diff --exit-code -- index.html pages assets/synthetic-projections.csv _7eff7e24/manifest.json
