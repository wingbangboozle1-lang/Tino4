name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit and regression tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Build the site
        run: python tools/build.py
      - name: Verify the built site
        run: python tools/verify.py
      - name: Confirm the build is reproducible
        run: |
          git add -A
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            echo "::error::The committed site does not match a fresh build. Run tools/build.py and commit the output."
            exit 1
          fi
