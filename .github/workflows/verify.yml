name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit and regression tests
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Build the site
        run: python tools/build.py
      - name: Optional DOM smoke test for the local-only panels
        # jsdom is not a published dependency, so this step may skip cleanly; the
        # unit tests already gate the rebuild-and-diff check (tools/recheck.py).
        continue-on-error: true
        run: |
          npm install --no-save --no-audit --no-fund jsdom
          node tools/dom-test.cjs
      - name: Verify the built site
        run: python tools/verify.py
      - name: Confirm the build is reproducible
        run: |
          git add -A
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            echo "::error::The committed site does not match a fresh build. Run tools/build.py and commit the output."
            exit 1
          fi
